[package]
name = "greekgod-sync-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
axum = "=0.8.9"
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
greekgod-storage = { path = "../../crates/greekgod-storage" }
greekgod-sync = { path = "../../crates/greekgod-sync" }
if-addrs = "=0.15.0"
mdns-sd = "=0.21.0"
rcgen = "=0.14.9"
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading"] }

[dev-dependencies]
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
tempfile = "3"
