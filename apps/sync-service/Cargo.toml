[package]
name = "greekgod-sync-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
axum = "=0.8.9"
greekgod-storage = { path = "../../crates/greekgod-storage" }
greekgod-sync = { path = "../../crates/greekgod-sync" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
