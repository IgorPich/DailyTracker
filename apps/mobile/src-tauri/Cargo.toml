[package]
name = "greekgod-mobile"
version = "3.0.2"
description = "GreekGod — prywatny mobilny logger treningowy"
authors = ["Igor Pich"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "greekgod_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
greekgod-storage = { path = "../../../crates/greekgod-storage" }
greekgod-sync-client = { path = "../../../crates/greekgod-sync-client" }
greekgod-mobile-platform = { path = "../../../crates/greekgod-mobile-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tokio = { version = "=1.53.1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
