[package]
name = "greekgod-mobile"
version = "3.0.0"
description = "GreekGod — prywatny mobilny logger treningowy"
authors = ["Igor Pich"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "greekgod_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
greekgod-storage = { path = "../../../crates/greekgod-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
