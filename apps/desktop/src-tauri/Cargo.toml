[package]
name = "greekgod"
version = "3.0.0"
description = "GreekGod — prywatny dziennik treningowy"
authors = ["Igor Pich"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "greekgod_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
native-sqlite-shadow = ["dep:greekgod-storage"]
native-sqlite-authority = ["dep:greekgod-storage"]
native-sqlite-production-authority = ["native-sqlite-authority"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
greekgod-storage = { path = "../../../crates/greekgod-storage", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
