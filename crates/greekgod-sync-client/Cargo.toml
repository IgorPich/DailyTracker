[package]
name = "greekgod-sync-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
greekgod-storage = { path = "../greekgod-storage" }
greekgod-sync = { path = "../greekgod-sync" }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
