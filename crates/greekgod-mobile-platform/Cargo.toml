[package]
name = "greekgod-mobile-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
links = "greekgod-mobile-platform"
build = "build.rs"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false }
thiserror = "2"
