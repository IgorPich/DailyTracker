[package]
name = "greekgod-storage"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
rusqlite = { version = "=0.40.1", default-features = false, features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
