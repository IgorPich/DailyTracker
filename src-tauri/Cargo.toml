[package]
name = "formlog"
version = "2.2.0"
description = "Personal Fitness Tracker"
authors = ["Igor Pich"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "formlog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
